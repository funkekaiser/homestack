services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - /home/jonathan/data/uptime-kuma:/app/data
    ports:
      # host-local only (mergerfs-check timer pushes to localhost:3001);
      # LAN/tailnet access goes through Caddy (uptime.example.com)
      - 127.0.0.1:3001:3001
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: curl -sf http://localhost:3001 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      caddy: uptime.example.com
      caddy.tls.dns: "cloudflare {env.CLOUDFLARE_API_TOKEN}"
      caddy.@external.not.remote_ip: "192.168.0.0/24 100.64.0.0/10 fd7a:115c:a1e0::/48 172.16.0.0/12 10.0.0.0/8 127.0.0.1/8 ::1"
      caddy.log: ""
      caddy.route.0_crowdsec: ""
      caddy.route.1_respond: '@external "Forbidden" 403'
      # Static name, not {{upstreams}} — request-time DNS avoids CDP's boot-race
      # (empty upstream baked into config) and reload churn. See pelican/compose.yaml.
      caddy.route.2_reverse_proxy: "uptime-kuma:3001"
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true