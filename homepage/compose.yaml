services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    init: true
    healthcheck:
      test: wget --spider -q http://localhost:3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${DOCKER_GROUP_ID}
      - TZ=${TZ:-Europe/Vienna}
      - HOMEPAGE_ALLOWED_HOSTS=home.example.com
      - HOMEPAGE_VAR_PLEX_API_KEY=${PLEX_API_KEY}
      - HOMEPAGE_VAR_ADGUARD_USER=${ADGUARD_USER}
      - HOMEPAGE_VAR_ADGUARD_PASS=${ADGUARD_PASS}
      - HOMEPAGE_VAR_ADGUARD_BACKUP_USER=${ADGUARD_BACKUP_USER}
      - HOMEPAGE_VAR_ADGUARD_BACKUP_PASS=${ADGUARD_BACKUP_PASS}
      - HOMEPAGE_VAR_HOMEASSISTANT_API_KEY=${HOMEASSISTANT_API_KEY}
      - HOMEPAGE_VAR_UPTIMEKUMA_SLUG=${UPTIMEKUMA_SLUG}
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/storage:/mnt/storage:ro
    ports:
      - 3000:3000
    networks:
      - proxy_network
    labels:
      caddy: home.example.com
      caddy.reverse_proxy: "homepage:3000"
      caddy.tls.dns: "cloudflare {env.CLOUDFLARE_API_TOKEN}"

networks:
  proxy_network:
    external: true
