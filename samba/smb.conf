[global]
   workgroup = WORKGROUP
   server string = Samba Server
   security = user
   # 'bad user' maps failed logins to the guest account
   map to guest = bad user
   guest account = nobody
   log level = 1

   netbios name = serverino
   host msdfs = no
   
   # Global macOS optimizations
   vfs objects = fruit streams_xattr
   fruit:aapl = yes
   fruit:nfs_aces = no
   fruit:metadata = stream
   fruit:model = Macmini

[Plex]
   path = /mnt/storage/media-stack/
   browseable = yes
   writable = yes
   # Authenticated-only: no guest write. With the global `map to guest = bad user`,
   # leaving 'nobody' in valid users would let any failed login write/delete media.
   guest ok = no
   valid users = serverino, jonathan
   vfs objects = fruit streams_xattr
   directory mask = 0775
   create mask = 0775

[TimeMachine]
   # DELIBERATELY the bare hdd2 branch, NOT the mergerfs pool (/mnt/storage).
   # A sparsebundle is one logical object made of thousands of band files, and
   # mergerfs (category.create=mfs) scatters them across every branch — so ANY
   # single drive death corrupts the ENTIRE backup, not just its share of it.
   # (Before this change: bands spread over hdd1/hdd2/hdd4/hdd5, with Info.plist
   # alone on hdd1.) The pool is a run-to-failure JBOD with no redundancy and this
   # is the only irreplaceable data on it. Serving the branch directly keeps the
   # whole bundle on one disk: 4x failure surface -> 1x.
   # See scripts/consolidate-timemachine.sh.
   path = /mnt/hdd2/TimeMachine/
   browseable = yes
   writable = yes
   # Keep this private! Guest access can break Time Machine's security model
   valid users = serverino, jonathan
   vfs objects = fruit streams_xattr
   fruit:time machine = yes
   # Cap the sparsebundle (2026-08-10). hdd2 now holds the borg on-site repo as well, and
   # an uncapped Time Machine grows until the disk is full — which is precisely how the
   # repo died on ssd2. There is no partition between them by design: two directories on
   # one ext4 share free space with no size to balance, so the only thing needed is a
   # ceiling on the one that grows without bound. 2T against ~1.7T in use leaves TM ~300 G
   # of runway and the repo ~500 G of hdd2's 953 G free. Time Machine thins its own oldest
   # snapshots when it reaches the cap; it does not fail.
   fruit:time machine max size = 2T