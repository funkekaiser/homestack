# ~/homelab/borgmatic/config/config.yaml
# Backs up serverino's irreplaceable data to two repos:
#   1. local mergerfs pool  (fast on-site restore)
#   2. Hetzner Storage Box   (offsite, append-only enforced server-side)

# The whole home dir (changed 2026-07-27), not an enumerated list of paths —
# see borgmatic/compose.yaml for why. Everything under ~ is protected by
# default; the exceptions below are deliberate and regenerable.
# /mnt/source IS ~ — so ~/data still lands at /mnt/source/data, exactly where
# every existing archive already has it. Path continuity is deliberate.
source_directories:
    - /mnt/source

repositories:
    # ── On-site repo on the mergerfs pool ──
    - path: /mnt/borg-repository
      label: pool

    # ── Offsite: Hetzner Storage Box over SFTP ──
    # NOTE: Hetzner uses port 23 for SSH/SFTP, not 22. The leading /./ makes
    # the path relative to the storage box home dir.
    # Replace uXXXXXX with your actual Storage Box sub-account username.
    - path: ssh://USER-sub1@USER.your-storagebox.de:23/./borg-HOSTNAME
      label: hetzner

# Exclusions — skip caches and junk that shouldn't be in a backup.
# Everything here must be regenerable from scratch: this is the list that turns
# "back up ~" from 126 G into 121 G, and anything wrongly on it is invisible.
exclude_patterns:
    - '**/.cache'
    - '**/node_modules'
    - '**/*.tmp'
    - '**/.DS_Store'
    # Dev-tool caches under ~ — all re-downloaded on demand (~5 G together).
    - /mnt/source/.vscode-server      # 3.6 G, reinstalled on first connect
    - /mnt/source/.claude/remote      # 866 M of remote-session cache
    - /mnt/source/.local/share/claude # 786 M, same
    - /mnt/source/.npm
    - /mnt/source/.bun
    - /mnt/source/.codex
    # Generated by `make public` from the tracked repo — never authored here.
    - /mnt/source/public-repos
    # NOT excluded, on purpose: ~/.ssh (the key that reaches this very repo at
    # Hetzner, and pushes the homelab repo to GitHub), ~/.config, ~/homelab,
    # ~/.claude/projects (holds the memory dir).

exclude_if_present:
    - .nobackup

# ── Retention ──
# Prune + compact run nightly against BOTH repos (no append-only complications).
# Offsite ransomware/corruption protection is handled by Hetzner Storage Box
# scheduled snapshots, which serverino's credentials cannot touch.
keep_daily: 7
keep_weekly: 4
keep_monthly: 6

# Integrity check cadence. Full data-read verification monthly; cheap checks weekly.
checks:
    - name: repository
      frequency: 2 weeks
    - name: archives
      frequency: 1 month

# Ping a monitoring endpoint on success/failure (optional, set via env)
uptime_kuma:
    push_url: "${HEALTHCHECKS_PINGURL}"